name: Actualizar y publicar reporte

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/.force_update"

permissions:
  contents: read

concurrency:
  group: actualizar-reporte-produccion
  cancel-in-progress: true

jobs:
  update-report:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Validar configuración
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_ROOT_FOLDER_ID: ${{ vars.DRIVE_ROOT_FOLDER_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || { echo "::error::Falta GOOGLE_SERVICE_ACCOUNT_JSON"; exit 1; }
          test -n "$DRIVE_ROOT_FOLDER_ID" || { echo "::error::Falta DRIVE_ROOT_FOLDER_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Falta CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Falta CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restaurar fuentes descargadas
        uses: actions/cache@v4
        with:
          path: inputs
          key: reporte-inputs-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            reporte-inputs-${{ runner.os }}-

      - name: Descargar fuentes privadas desde Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_ROOT_FOLDER_ID: ${{ vars.DRIVE_ROOT_FOLDER_ID }}
        run: python scripts/download_drive_inputs.py

      - name: Generar Móviles y Accesorios
        run: python scripts/update_all_reports.py

      - name: Validar salida
        run: |
          test -s dist/index.html
          test -s dist/app.js
          test -s dist/accesorios/index.html
          test -s dist/accesorios/app.js
          grep -q "table-stock-channel-model" dist/index.html
          grep -q "table-stock-channel-model" dist/accesorios/index.html

      - name: Publicar directamente en Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: reporte-share-moviles
        run: npx -y wrangler@latest pages deploy dist --project-name "$CLOUDFLARE_PROJECT_NAME" --branch main

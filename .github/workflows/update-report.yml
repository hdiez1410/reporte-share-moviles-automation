name: Actualizar y publicar reporte

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/.force_update"

permissions:
  contents: read

concurrency:
  group: actualizar-reporte-produccion
  cancel-in-progress: true

jobs:
  update-report:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Validar configuración
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_ROOT_FOLDER_ID: ${{ vars.DRIVE_ROOT_FOLDER_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || { echo "::error::Falta GOOGLE_SERVICE_ACCOUNT_JSON"; exit 1; }
          test -n "$DRIVE_ROOT_FOLDER_ID" || { echo "::error::Falta DRIVE_ROOT_FOLDER_ID"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Falta CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Falta CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Actualizar, publicar y verificar (intento 1)
        id: first_attempt
        timeout-minutes: 45
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_ROOT_FOLDER_ID: ${{ vars.DRIVE_ROOT_FOLDER_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: reporte-share-moviles
          REPORT_REQUEST_ID: ${{ github.run_id }}-1
        run: |
          python scripts/download_drive_inputs.py --latest-only
          python scripts/update_incremental_reports.py
          test -s dist/index.html
          test -s dist/app.js
          test -s dist/accesorios/index.html
          test -s dist/accesorios/app.js
          test -s dist/status.json
          grep -q "table-stock-channel-model" dist/index.html
          grep -q "table-stock-channel-model" dist/accesorios/index.html
          npx -y wrangler@latest pages deploy dist --project-name "$CLOUDFLARE_PROJECT_NAME" --branch main
          python scripts/verify_public_status.py outputs/status.json

      - name: Actualizar, publicar y verificar (intento 2)
        id: second_attempt
        if: steps.first_attempt.outcome == 'failure'
        timeout-minutes: 45
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_ROOT_FOLDER_ID: ${{ vars.DRIVE_ROOT_FOLDER_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: reporte-share-moviles
          REPORT_REQUEST_ID: ${{ github.run_id }}-2
        run: |
          sleep 60
          rm -rf outputs dist
          python scripts/download_drive_inputs.py --latest-only
          python scripts/update_incremental_reports.py
          test -s dist/index.html
          test -s dist/app.js
          test -s dist/accesorios/index.html
          test -s dist/accesorios/app.js
          test -s dist/status.json
          grep -q "table-stock-channel-model" dist/index.html
          grep -q "table-stock-channel-model" dist/accesorios/index.html
          npx -y wrangler@latest pages deploy dist --project-name "$CLOUDFLARE_PROJECT_NAME" --branch main
          python scripts/verify_public_status.py outputs/status.json

      - name: Confirmar resultado
        if: always()
        run: |
          if [ "${{ steps.first_attempt.outcome }}" = "success" ] || [ "${{ steps.second_attempt.outcome }}" = "success" ]; then
            echo "Reporte actualizado y verificado públicamente."
            exit 0
          fi
          echo "::error::Los dos intentos de actualización fallaron."
          exit 1
